name: Windows helper

# The Windows helper (native/windows, written in Go) cannot be run on a Mac, so this workflow is what actually
# executes its Win32 layer: hook installation, SendInput and the struct layouts.

on:
  push:
    paths: ['native/windows/**', 'src/settings.js', 'src/config.js', '.github/workflows/windows-helper.yml']
  pull_request:
    paths: ['native/windows/**', 'src/settings.js', 'src/config.js', '.github/workflows/windows-helper.yml']
  workflow_dispatch:

jobs:
  portable:
    name: Portable logic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: native/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/windows/go.mod
          cache-dependency-path: native/windows/go.sum
      - run: go vet ./...
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          go test ./... -v -count=1 2>&1 | tee test.log
      - name: Cross-compile for Windows (amd64 and arm64)
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...
      - name: Report
        if: always()
        shell: bash
        run: |
          # Job logs need a token to read through the API; annotations do not.
          pass=$(grep -c -- '^--- PASS' test.log || true); fail=$(grep -c -- '^--- FAIL' test.log || true); skip=$(grep -c -- '^--- SKIP' test.log || true)
          echo "::notice title=go test (${{ matrix.os }})::pass=$pass fail=$fail skip=$skip"
          if [ "$fail" != "0" ]; then
            msg=$(grep -E -- '^(--- FAIL|FAIL|panic)|_test\.go:[0-9]+:' test.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=go test failures (${{ matrix.os }})::$msg"
          fi

  windows:
    name: Win32 layer (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/windows/go.mod
          cache-dependency-path: native/windows/go.sum
      - name: Tests (portable logic + Win32 exports, struct layout and the real mouse hook)
        shell: bash
        run: |
          set -o pipefail
          go test ./... -v -count=1 -timeout 5m 2>&1 | tee test.log
      - name: Report
        if: always()
        shell: bash
        run: |
          # Job logs need a token to read through the API; annotations do not.
          pass=$(grep -c -- '^--- PASS\|^    --- PASS' test.log || true); fail=$(grep -c -- '^--- FAIL\|^    --- FAIL' test.log || true); skip=$(grep -c -- '^--- SKIP\|^    --- SKIP' test.log || true)
          echo "::notice title=go test (windows)::pass=$pass fail=$fail skip=$skip"
          detail=$(grep -E -- '--- (PASS|FAIL|SKIP)' test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=go test detail (windows)::$detail"
          if [ "$fail" != "0" ]; then
            msg=$(grep -E -- '^(--- FAIL|FAIL|panic)|_test\.go:[0-9]+:' test.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=go test failures (windows)::$msg"
          fi
      - name: Build
        run: |
          go build -trimpath -ldflags "-s -w" -o MouseRemapHelper.exe .
          $env:GOARCH = "arm64"
          go build -trimpath -ldflags "-s -w" -o MouseRemapHelper-arm64.exe .
      - name: Helper answers the command-line modes
        shell: pwsh
        run: |
          $out = ./MouseRemapHelper.exe --check-permission
          if ($out.Trim() -ne "true") { throw "--check-permission printed '$out'" }
          $apps = ./MouseRemapHelper.exe --list-apps
          Write-Host "--list-apps: $apps"
          $null = $apps | ConvertFrom-Json
          $r = ./MouseRemapHelper.exe --resolve-apps=notepad.exe
          Write-Host "--resolve-apps: $r"
          $null = $r | ConvertFrom-Json
      - uses: actions/upload-artifact@v4
        with:
          name: MouseRemapHelper-windows
          path: |
            native/windows/MouseRemapHelper.exe
            native/windows/MouseRemapHelper-arm64.exe
